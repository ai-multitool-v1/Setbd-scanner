name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK (debug-signed, installable)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: setbd-scanner-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_D=app/build/outputs/apk/debug/app-debug.apk
          APK_R=app/build/outputs/apk/release/app-release.apk
          if gh release view v1.0-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0-latest "$APK_D" "$APK_R" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.0-latest "$APK_D" "$APK_R" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SETBD Scanner v1.0" \
              --notes "Automated CI build. Install app-debug.apk directly; app-release.apk is debug-signed for convenience."
          fi
